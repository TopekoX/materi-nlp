# ---------------------------------------------------------------------------
# Reusable MkDocs + Material template.
# To start a new subject, edit: site identity, `nav`, and (optionally) palette.
# ---------------------------------------------------------------------------

# --- Site identity (EDIT PER SUBJECT) --------------------------------------
site_name: "NLP Learning Hub"
site_description: "Belajar Natural Language Processing dengan Python: dari dasar hingga deployment, dengan studi kasus klasifikasi pesan kebencanaan."
# Canonical URL. For GitHub Pages: https://<user>.github.io/<repo>/
site_url: https://topekox.github.io/materi-nlp/

# --- Theme (shared) --------------------------------------------------------
theme:
  name: material
  language: id
  font: false # system fonts; no Google Fonts request
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path # breadcrumbs
    - navigation.footer # previous / next links
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  # Native three-state switcher: System -> Light -> Dark.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: "Theme: system (click for light)"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: "Theme: light (click for dark)"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: "Theme: dark (click for system)"

