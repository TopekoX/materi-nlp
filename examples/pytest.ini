[pytest]
testpaths = tests
# Sastrawi 1.0.1 memanggil re.sub(..., 1) dengan count posisional; Python 3.13+ memberi
# DeprecationWarning. Peringatan berasal dari library, bukan kode di repository ini.
filterwarnings =
    ignore:'count' is passed as positional argument:DeprecationWarning
# starlette 1.x menandai TestClient+httpx sebagai deprecated (peringatan dari library, bukan kode repository ini).
    ignore:Using `httpx` with `starlette.testclient`
